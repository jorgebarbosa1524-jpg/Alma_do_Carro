name: APK Android (Alma do Carro)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Gerar APK
        run: echo "sdk=$ANDROID_HOME" && yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar
        run: gradle -p android assembleRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk AlmaDoCarro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlmaDoCarro-apk
          path: AlmaDoCarro.apk

      - name: Publicar link de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create apk AlmaDoCarro.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Alma do Carro - APK" --notes "Toque em AlmaDoCarro.apk para baixar e instalar." --latest=false
