name: APK Android (Alma do Carro)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Gerar APK
        run: echo "sdk=$ANDROID_HOME" && yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar
        run: gradle -p android assembleRelease --no-daemon

      - name: Renomear
        run: |
          cp android/app/build/outputs/apk/renegade/release/app-renegade-release.apk AlmaDoCarro.apk
          cp android/app/build/outputs/apk/ecosport/release/app-ecosport-release.apk AlmaDaEcoSport.apk
          cp android/app/build/outputs/apk/civic/release/app-civic-release.apk AlmaDoCivic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlmaDoCarro-apks
          path: |
            AlmaDoCarro.apk
            AlmaDaEcoSport.apk
            AlmaDoCivic.apk

      - name: Publicar link de download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-estavel --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create apk-estavel AlmaDoCarro.apk AlmaDaEcoSport.apk AlmaDoCivic.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Alma do Carro - versão estável" --notes "AlmaDoCarro.apk = Jeep Renegade (Jorge). AlmaDaEcoSport.apk = EcoSport 2006 (Jean). AlmaDoCivic.apk = Civic G8 2010 (Gabriel)." --latest=false
